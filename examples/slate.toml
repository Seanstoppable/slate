# Example Slate configuration
# Copy to ~/.config/slate/slate.toml

[global]
refresh_interval = 300

[layout]
rows = 3
cols = 3

# --- Row 0 ---

[[widget]]
type = "github.com/slate-community/slate-digitalclock"
position = { row = 0, col = 0 }
use24HourFormat = true
showSeconds = true

[[widget]]
type = "builtin:resource_usage"
position = { row = 0, col = 1 }

[[widget]]
type = "github.com/slate-community/slate-lunarphase"
position = { row = 0, col = 2 }

# --- Row 1 ---

[[widget]]
type = "github.com/slate-community/slate-pihole"
position = { row = 1, col = 0 }
apiUrl = "http://192.168.1.35/admin/api.php"

[[widget]]
type = "github.com/slate-community/slate-hackernews"
position = { row = 1, col = 1, col_span = 2 }
numberOfStories = 10

# --- Row 2 ---

# GitHub plugin (requires token)
# [[widget]]
# type = "github.com/slate-community/slate-github"
# position = { row = 2, col = 0 }
# token = "${GITHUB_TOKEN}"
# repos = ["myorg/myrepo"]

# Weather plugin (requires API key)
# [[widget]]
# type = "github.com/slate-community/slate-weather"
# position = { row = 2, col = 1 }
# api_key = "${OPENWEATHER_API_KEY}"
# location = "New York"

# Yahoo Finance stock quotes (no API key required)
# [[widget]]
# type = "github.com/slate-community/slate-yfinance"
# position = { row = 2, col = 2 }
# symbols = ["AAPL", "MSFT", "GC=F"]
# sort = true

# Lua script widget
# [[widget]]
# type = "lua:~/.config/slate/scripts/greeting.lua"
# position = { row = 2, col = 2 }

# WASM pomodoro plugin -- press s/p/x while focused to control it.
# State is persisted via the storage permission, so it survives restarts.
# [[widget]]
# type = "wasm:plugins/pomodoro/pomodoro.wasm"
# position = { row = 2, col = 2 }
# work_minutes = 25
# break_minutes = 5

[updates]
check_interval = "daily"
notify = true
auto_update = false
