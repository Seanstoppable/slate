[package]
name = "slate-vcs"
version = "0.1.0"
edition = "2021"
description = "Version control status widget for Slate (git/hg)"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slate-plugin-exec = { path = "../../crates/slate-plugin-exec" }
