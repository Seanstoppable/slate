[plugin]
name = "feedreader"
description = "RSS/Atom feed reader with selectable items"
tags = ["news"]
version = "0.1.0"
author = "Slate Community"
language = "rust"

[permissions]
network_from_config = ["feeds"]

[config]
feeds = { type = "array", required = true, description = "List of RSS or Atom feed URLs to aggregate; their hosts are the only network destinations" }
