[package]
name = "slate-todo"
version = "0.1.0"
edition = "2021"
description = "A todo list widget for Slate — reads todo.txt from the plugin data directory"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
