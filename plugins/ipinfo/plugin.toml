[plugin]
name = "ipinfo"
description = "Shows your public IP and geolocation info (supports ipinfo.io and ip-api.com backends)"
tags = ["ip", "network", "utility"]
version = "0.2.0"
author = "Slate Community"

[permissions]
network = ["ipinfo.io", "ip-api.com"]

[settings]
# Backend provider: "ipinfo" (default) or "ipapi"
backend = "ipinfo"
# Fields to display when using ipapi backend (order is preserved):
#   ip, isp, as, asName, city, district, region, regionName,
#   country, countryCode, continent, continentCode, coordinates,
#   postalCode, currency, organization, timezone, reverseDNS
# args = ["ip", "city", "regionName", "country", "isp", "timezone"]

[config]
args = { type = "string", required = false, description = "" }
backend = { type = "string", required = false, description = "" }
