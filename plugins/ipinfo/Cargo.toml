[package]

name = "slate-ipinfo"

version = "0.1.0"

edition = "2021"

description = "IP information widget for Slate"



[lib]

crate-type = ["cdylib"]



[dependencies]

serde = { version = "1", features = ["derive"] }

serde_json = "1"



[target.'cfg(target_arch = "wasm32")'.dependencies]

extism-pdk = "1"

slate-plugin-http = { path = "../../crates/slate-plugin-http" }

