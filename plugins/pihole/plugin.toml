[plugin]
name = "Pi-hole"
description = "Displays Pi-hole DNS filtering statistics"
tags = ["dns", "network", "pihole"]
version = "0.1.0"

[permissions]
network = ["*"]

[config]
apiUrl = { type = "string", required = false, description = "Pi-hole admin API URL (e.g. http://192.168.1.35/admin/api.php)" }
