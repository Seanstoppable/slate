[plugin]
name = "Pi-hole"
description = "Displays Pi-hole DNS filtering statistics"
tags = ["dns", "network", "pihole"]
version = "0.1.0"

[config]
apiUrl = { type = "string", required = false, description = "Pi-hole admin API URL; its host is the only network destination (e.g. http://192.168.1.35/admin/api.php)" }
authToken = { type = "string", required = false, description = "Pi-hole API auth token (from Settings > API > Show API token)" }
