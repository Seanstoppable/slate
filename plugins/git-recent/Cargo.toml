[package]
name = "slate-git-recent"
version = "0.1.0"
edition = "2021"
description = "Recent git commits widget for Slate"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
