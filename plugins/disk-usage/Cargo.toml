[package]
name = "slate-disk-usage"
version = "0.1.0"
edition = "2021"
description = "Disk space usage widget for Slate"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slate-plugin-exec = { path = "../../crates/slate-plugin-exec" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
