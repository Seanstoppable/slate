[package]
name = "slate-mlb"
version = "0.1.0"
edition = "2021"
description = "MLB schedule and standings via MLB Stats API"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
slate-plugin-http = { path = "../../crates/slate-plugin-http" }
