[package]
name = "slate-urlcheck"
version = "0.1.0"
edition = "2021"
description = "URL health check widget for Slate"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
