[package]
name = "slate-hackernews"
version = "0.1.0"
edition = "2021"
description = "Hacker News top stories widget for Slate"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
slate-plugin-http = { path = "../../crates/slate-plugin-http" }
