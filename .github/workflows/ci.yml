name: CI

on:
  pull_request:
    branches: [main, seanstoppable-slate-terminal-dashboard]
  push:
    branches: [main, seanstoppable-slate-terminal-dashboard]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin --workspace --out xml --output-dir coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

      - name: Check coverage threshold
        run: |
          # Parse coverage from the cobertura.xml already produced above instead
          # of re-running the (slow, instrumented) tarpaulin build a second time.
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage/cobertura.xml').getroot()
          print(round(float(root.attrib['line-rate']) * 100, 2))
          ")
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=85
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✓ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
