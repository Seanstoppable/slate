<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate Plugins</title>
<style>
:root {
  --bg: #1f242d;
  --bg-elevated: #262d38;
  --surface: rgba(45, 54, 68, 0.78);
  --surface-strong: rgba(56, 66, 82, 0.92);
  --surface-soft: rgba(72, 84, 104, 0.35);
  --border: rgba(160, 174, 192, 0.18);
  --border-strong: rgba(184, 198, 216, 0.28);
  --text: #edf2f7;
  --text-muted: #a5b1c2;
  --accent: #8fb4ff;
  --accent-strong: #b9ccff;
  --green: #8ad7b1;
  --orange: #f2bf7a;
  --purple: #c7b6ff;
  --shadow-lg: 0 24px 60px rgba(8, 12, 18, 0.36);
  --shadow-md: 0 18px 40px rgba(8, 12, 18, 0.24);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  padding: 2rem;
  position: relative;
  background-image:
    radial-gradient(circle at top, rgba(143, 180, 255, 0.14), transparent 32%),
    linear-gradient(180deg, #242a34 0%, #1c2129 100%);
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(199, 182, 255, 0.12), transparent 24%),
    radial-gradient(circle at 85% 12%, rgba(138, 215, 177, 0.08), transparent 18%);
  pointer-events: none;
}
.container { max-width: 1200px; margin: 0 auto; }
header {
  position: relative;
  margin-bottom: 1.5rem;
  padding: 2.5rem;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: linear-gradient(180deg, rgba(58, 68, 84, 0.82), rgba(39, 46, 57, 0.88));
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top left, rgba(143, 180, 255, 0.18), transparent 34%),
    linear-gradient(135deg, rgba(199, 182, 255, 0.08), transparent 60%);
  pointer-events: none;
}
.hero-copy {
  position: relative;
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.35rem 0.75rem;
  border-radius: 999px;
  border: 1px solid rgba(184, 198, 216, 0.2);
  background: rgba(121, 141, 176, 0.16);
  color: var(--accent-strong);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 1rem;
}
header h1 {
  font-size: clamp(2.4rem, 6vw, 4rem);
  line-height: 1.05;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, #f8fbff 5%, var(--accent-strong) 48%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p {
  color: var(--text-muted);
  font-size: 1.05rem;
  margin: 0.85rem auto 0;
  max-width: 640px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2rem;
  align-items: center;
  padding: 1rem;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: rgba(37, 43, 53, 0.76);
  box-shadow: var(--shadow-md);
  backdrop-filter: blur(18px);
}
.search-box {
  flex: 1;
  min-width: 240px;
  padding: 0.85rem 1rem;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  outline: none;
}
.search-box::placeholder { color: var(--text-muted); }
.search-box:focus {
  border-color: rgba(143, 180, 255, 0.42);
  box-shadow: 0 0 0 4px rgba(143, 180, 255, 0.12);
}
.filter-group {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 0.55rem 0.95rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-soft);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s ease;
}
.filter-btn:hover {
  border-color: rgba(143, 180, 255, 0.38);
  color: var(--text);
  transform: translateY(-1px);
}
.filter-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  color: #10141b;
  border-color: transparent;
  box-shadow: 0 10px 20px rgba(143, 180, 255, 0.22);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.3rem;
}
.plugin-card {
  background: linear-gradient(180deg, rgba(57, 67, 83, 0.88), rgba(41, 47, 58, 0.94));
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 1.35rem;
  transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
  box-shadow: 0 14px 32px rgba(9, 13, 19, 0.18);
  backdrop-filter: blur(16px);
}
.plugin-card:hover {
  border-color: rgba(143, 180, 255, 0.36);
  transform: translateY(-4px);
  box-shadow: 0 22px 48px rgba(8, 12, 18, 0.28);
}
.plugin-card.hidden { display: none; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 0.75rem;
}
.card-header h3 {
  font-size: 1.18rem;
  color: #f8fbff;
  letter-spacing: -0.02em;
}
.badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.kind-badge {
  font-size: 0.7rem;
  padding: 0.28rem 0.58rem;
  border-radius: 999px;
  font-weight: 600;
  text-transform: uppercase;
  border: 1px solid transparent;
}
.kind-badge.builtin { background: rgba(82, 133, 103, 0.18); border-color: rgba(138, 215, 177, 0.18); color: var(--green); }
.kind-badge.plugin { background: rgba(93, 121, 176, 0.18); border-color: rgba(143, 180, 255, 0.2); color: var(--accent); }
.kind-badge.script { background: rgba(146, 111, 70, 0.2); border-color: rgba(242, 191, 122, 0.18); color: var(--orange); }
.lang-badge {
  font-size: 0.7rem;
  padding: 0.28rem 0.58rem;
  border-radius: 999px;
  background: rgba(106, 93, 150, 0.2);
  color: var(--purple);
  border: 1px solid rgba(199, 182, 255, 0.16);
}
.lang-rust { background: rgba(161, 98, 55, 0.2); color: #ffb280; border-color: rgba(255, 178, 128, 0.18); }
.lang-go { background: rgba(60, 122, 131, 0.2); color: #8be7ef; border-color: rgba(139, 231, 239, 0.16); }
.lang-zig { background: rgba(147, 125, 57, 0.2); color: #ffe08a; border-color: rgba(255, 224, 138, 0.16); }
.lang-ts { background: rgba(77, 110, 161, 0.22); color: #adc6ff; border-color: rgba(173, 198, 255, 0.16); }
.description {
  color: var(--text-muted);
  font-size: 0.93rem;
  margin-bottom: 0.95rem;
}
.card-meta { font-size: 0.8rem; }
.os-row { margin-bottom: 0.4rem; }
.os-badge {
  display: inline-block;
  font-size: 0.75rem;
  padding: 0.2rem 0.48rem;
  border-radius: 999px;
  background: rgba(124, 140, 164, 0.18);
  border: 1px solid rgba(160, 174, 192, 0.14);
  margin-right: 0.2rem;
}
.perms-row {
  color: var(--text-muted);
  margin-bottom: 0.3rem;
}
.perm-tag {
  display: inline-block;
  font-size: 0.72rem;
  padding: 0.14rem 0.45rem;
  border-radius: 999px;
  background: rgba(146, 111, 70, 0.18);
  color: var(--orange);
  border: 1px solid rgba(242, 191, 122, 0.16);
  margin: 0.1rem 0.2rem 0.1rem 0;
}
.version-row { color: var(--text-muted); }
.tags-row { margin-bottom: 0.6rem; }
.tag-badge {
  display: inline-block;
  font-size: 0.72rem;
  padding: 0.18rem 0.55rem;
  border-radius: 999px;
  background: rgba(93, 121, 176, 0.18);
  color: var(--accent);
  border: 1px solid rgba(143, 180, 255, 0.16);
  margin: 0.1rem 0.2rem 0.1rem 0;
  cursor: pointer;
  transition: all 0.2s ease;
}
.tag-badge:hover {
  background: rgba(113, 145, 208, 0.28);
  color: var(--accent-strong);
}
.stats {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 1rem;
  font-size: 0.92rem;
}
#no-results {
  text-align: center;
  color: var(--text-muted);
  padding: 3rem;
  display: none;
}
/* Modal styles */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(14, 18, 24, 0.72);
  z-index: 1000;
  padding: 2rem;
  overflow-y: auto;
  backdrop-filter: blur(16px);
}
.modal-overlay.active { display: flex; justify-content: center; align-items: flex-start; }
.modal {
  background: linear-gradient(180deg, rgba(59, 70, 87, 0.95), rgba(39, 46, 57, 0.98));
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  max-width: 700px;
  width: 100%;
  padding: 2rem;
  margin-top: 3rem;
  position: relative;
  box-shadow: var(--shadow-lg);
}
.modal-close {
  position: absolute;
  top: 1rem; right: 1rem;
  width: 2.25rem;
  height: 2.25rem;
  background: rgba(124, 140, 164, 0.12);
  border: 1px solid rgba(160, 174, 192, 0.16);
  border-radius: 999px;
  color: var(--text-muted);
  font-size: 1.25rem;
  cursor: pointer;
  transition: all 0.2s ease;
}
.modal-close:hover {
  color: var(--text);
  border-color: rgba(143, 180, 255, 0.24);
  background: rgba(143, 180, 255, 0.14);
}
.modal h2 {
  color: #f8fbff;
  margin-bottom: 0.5rem;
  font-size: 1.75rem;
  letter-spacing: -0.03em;
}
.modal .meta-line { color: var(--text-muted); margin-bottom: 1rem; }
.modal .section {
  margin-bottom: 1.2rem;
  padding: 1rem 1.1rem;
  border-radius: 18px;
  border: 1px solid rgba(160, 174, 192, 0.12);
  background: rgba(28, 34, 43, 0.26);
}
.modal .section h4 {
  color: var(--accent-strong);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.7rem;
}
.modal pre {
  background: rgba(18, 23, 30, 0.78);
  border: 1px solid rgba(160, 174, 192, 0.14);
  border-radius: 14px;
  padding: 1rem;
  overflow-x: auto;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.85rem;
  line-height: 1.5;
}
.modal code { color: var(--green); }
.modal .os-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.modal .os-item {
  padding: 0.3rem 0.8rem;
  border-radius: 999px;
  background: rgba(124, 140, 164, 0.18);
  border: 1px solid rgba(160, 174, 192, 0.14);
  font-size: 0.9rem;
}
.modal .perm-list { display: flex; flex-direction: column; gap: 0.4rem; }
.modal .perm-item {
  padding: 0.45rem 0.7rem;
  border-radius: 12px;
  background: rgba(146, 111, 70, 0.15);
  color: var(--orange);
  font-size: 0.85rem;
  font-family: monospace;
  border: 1px solid rgba(242, 191, 122, 0.14);
}
.modal .install-text {
  color: var(--text-muted);
  font-size: 0.9rem;
  white-space: pre-wrap;
}
.snapshot {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.85rem;
  overflow-x: auto;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.8rem;
  line-height: 1.3;
  white-space: pre;
}
.snapshot-hint {
  color: var(--text-muted);
  font-size: 0.85rem;
  font-style: italic;
}
@media (max-width: 720px) {
  body { padding: 1rem; }
  header { padding: 1.5rem; border-radius: 22px; }
  .controls { padding: 0.85rem; }
  .grid { grid-template-columns: 1fr; }
  .modal-overlay { padding: 1rem; }
  .modal { margin-top: 1rem; padding: 1.25rem; }
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="hero-copy">
    <div class="eyebrow">Slate plugin directory</div>
    <h1>⬡ Slate Plugins</h1>
    <p>Terminal dashboard widgets with a quieter, more refined slate look — WASM-sandboxed, multi-language, and installable from GitHub.</p>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" class="search-box" id="search" placeholder="Search plugins..." autocomplete="off">
  <div class="filter-group" id="os-filters">
    <button class="filter-btn active" data-os="all">🌐 All</button>
    <button class="filter-btn" data-os="macos">🍎 macOS</button>
    <button class="filter-btn" data-os="linux">🐧 Linux</button>
    <button class="filter-btn" data-os="windows">🪟 Windows</button>
  </div>
  <div class="filter-group" id="kind-filters">
    <button class="filter-btn active" data-kind="all">All Types</button>
    <button class="filter-btn" data-kind="builtin">Built-in</button>
    <button class="filter-btn" data-kind="plugin">Plugin</button>
    <button class="filter-btn" data-kind="script">Lua Script</button>
  </div>
  <div class="filter-group" id="tag-filters">
    <button class="filter-btn active" data-tag="all">All Tags</button>
  </div>
</div>

<div class="grid" id="grid">
{{CARDS}}
</div>

<div id="no-results">No plugins match your filters.</div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">&times;</button>
    <h2 id="modal-name"></h2>
    <div class="meta-line" id="modal-meta"></div>
    <p class="description" id="modal-desc" style="margin-bottom:1.5rem"></p>
    <div class="section">
      <h4>Configuration</h4>
      <pre><code id="modal-config"></code></pre>
    </div>
    <div class="section" id="modal-snapshot-section">
      <h4>Live Snapshot</h4>
      <div id="modal-snapshot"></div>
    </div>
    <div class="section">
      <h4>Platform Support</h4>
      <div class="os-list" id="modal-os"></div>
    </div>
    <div class="section">
      <h4>Permissions</h4>
      <div class="perm-list" id="modal-perms"></div>
    </div>
    <div class="section">
      <h4>Installation</h4>
      <div class="install-text" id="modal-install"></div>
    </div>
  </div>
</div>

<script>
const pluginData = {{PLUGIN_DATA}};

const cards = document.querySelectorAll('.plugin-card');
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
const stats = document.getElementById('stats');
const modal = document.getElementById('modal-overlay');

let osFilter = 'all';
let kindFilter = 'all';
let tagFilter = 'all';

// Build tag filter buttons dynamically from plugin data
(function buildTagFilters() {
  const tagSet = new Set();
  pluginData.forEach(p => { if (p.tags) p.tags.forEach(t => tagSet.add(t)); });
  const tagContainer = document.getElementById('tag-filters');
  Array.from(tagSet).sort().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tagFilter = tag;
      applyFilters();
    });
    tagContainer.appendChild(btn);
  });
  tagContainer.querySelector('[data-tag="all"]').addEventListener('click', () => {
    tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    tagContainer.querySelector('[data-tag="all"]').classList.add('active');
    tagFilter = 'all';
    applyFilters();
  });
})();

// Allow clicking tag badges on cards to filter
document.querySelectorAll('.tag-badge').forEach(badge => {
  badge.addEventListener('click', (e) => {
    e.stopPropagation();
    const tag = badge.textContent;
    const tagContainer = document.getElementById('tag-filters');
    tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    const btn = tagContainer.querySelector('[data-tag="' + tag + '"]');
    if (btn) btn.classList.add('active');
    tagFilter = tag;
    applyFilters();
  });
});

function updateStats() {
  const visible = document.querySelectorAll('.plugin-card:not(.hidden)').length;
  stats.textContent = visible + ' of ' + cards.length + ' plugins shown';
  noResults.style.display = visible === 0 ? 'block' : 'none';
}

function applyFilters() {
  const q = search.value.toLowerCase();
  cards.forEach(card => {
    const name = card.dataset.name.toLowerCase();
    const desc = card.dataset.desc.toLowerCase();
    const cardOs = card.dataset.os;
    const cardKind = card.dataset.kind;
    const cardTags = card.dataset.tags || '';

    const matchesSearch = !q || name.includes(q) || desc.includes(q) || cardTags.includes(q);
    const matchesOs = osFilter === 'all' || cardOs.includes(osFilter);
    const matchesKind = kindFilter === 'all' || cardKind === kindFilter;
    const matchesTag = tagFilter === 'all' || cardTags.split(' ').includes(tagFilter);

    card.classList.toggle('hidden', !(matchesSearch && matchesOs && matchesKind && matchesTag));
  });
  updateStats();
}

function showDetail(idx) {
  const p = pluginData[idx];
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-meta').textContent = 'v' + p.version + ' · ' + p.author + ' · ' + p.lang;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-config').textContent = p.config;

  const snapshotSection = document.getElementById('modal-snapshot-section');
  const snapshotEl = document.getElementById('modal-snapshot');
  if (p.snapshot) {
    snapshotEl.innerHTML = p.snapshot;
    snapshotSection.style.display = '';
  } else {
    snapshotEl.innerHTML = '<span class="snapshot-hint">No live snapshot available for this plugin type.</span>';
    snapshotSection.style.display = '';
  }

  const osEl = document.getElementById('modal-os');
  const osIcons = {macos: '🍎', linux: '🐧', windows: '🪟'};
  osEl.innerHTML = p.os.map(o => '<span class="os-item">' + (osIcons[o]||'') + ' ' + o + '</span>').join('');

  const permsEl = document.getElementById('modal-perms');
  if (p.perms.length === 0) {
    permsEl.innerHTML = '<em style="color:var(--text-muted)">None required</em>';
  } else {
    permsEl.innerHTML = p.perms.map(perm => '<span class="perm-item">' + perm + '</span>').join('');
  }

  document.getElementById('modal-install').textContent = p.install;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

search.addEventListener('input', applyFilters);

document.querySelectorAll('#os-filters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#os-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    osFilter = btn.dataset.os;
    applyFilters();
  });
});

document.querySelectorAll('#kind-filters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#kind-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    kindFilter = btn.dataset.kind;
    applyFilters();
  });
});

updateStats();
</script>
</body>
</html>
