<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate Plugins</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --orange: #d29922;
  --purple: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 2rem;
}
.container { max-width: 1200px; margin: 0 auto; }
header {
  text-align: center;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
header h1 {
  font-size: 2.5rem;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 0.5rem; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 2rem;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 0.6rem 1rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 1rem;
}
.search-box::placeholder { color: var(--text-muted); }
.filter-group {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 0.4rem 0.8rem;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 1.2rem;
}
.plugin-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.2rem;
  transition: border-color 0.2s, transform 0.1s;
  cursor: pointer;
}
.plugin-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.plugin-card.hidden { display: none; }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.5rem;
}
.card-header h3 { font-size: 1.15rem; color: var(--accent); }
.badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.kind-badge {
  font-size: 0.7rem;
  padding: 0.2rem 0.5rem;
  border-radius: 10px;
  font-weight: 600;
  text-transform: uppercase;
}
.kind-badge.builtin { background: #1f3d2a; color: var(--green); }
.kind-badge.plugin { background: #1c2d4f; color: var(--accent); }
.kind-badge.script { background: #3d2a1f; color: #f0a050; }
.lang-badge {
  font-size: 0.7rem;
  padding: 0.2rem 0.5rem;
  border-radius: 10px;
  background: #2d1f3d;
  color: var(--purple);
}
.lang-rust { background: #3d2a1f; color: #f97316; }
.lang-go { background: #1f3d3d; color: #06b6d4; }
.lang-zig { background: #3d3d1f; color: #eab308; }
.lang-ts { background: #1f2d3d; color: #3b82f6; }
.description {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
}
.card-meta { font-size: 0.8rem; }
.os-row { margin-bottom: 0.4rem; }
.os-badge {
  display: inline-block;
  font-size: 0.75rem;
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  background: #21262d;
  margin-right: 0.2rem;
}
.perms-row {
  color: var(--text-muted);
  margin-bottom: 0.3rem;
}
.perm-tag {
  display: inline-block;
  font-size: 0.72rem;
  padding: 0.1rem 0.4rem;
  border-radius: 4px;
  background: #2d1b00;
  color: var(--orange);
  margin: 0.1rem 0.2rem 0.1rem 0;
}
.version-row { color: var(--text-muted); }
.tags-row { margin-bottom: 0.6rem; }
.tag-badge {
  display: inline-block;
  font-size: 0.72rem;
  padding: 0.15rem 0.5rem;
  border-radius: 10px;
  background: #1c2d4f;
  color: var(--accent);
  margin: 0.1rem 0.2rem 0.1rem 0;
  cursor: pointer;
}
.tag-badge:hover { background: #264170; }
.stats {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 1rem;
  font-size: 0.9rem;
}
#no-results {
  text-align: center;
  color: var(--text-muted);
  padding: 3rem;
  display: none;
}
/* Modal styles */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  padding: 2rem;
  overflow-y: auto;
}
.modal-overlay.active { display: flex; justify-content: center; align-items: flex-start; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 700px;
  width: 100%;
  padding: 2rem;
  margin-top: 3rem;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 1rem; right: 1rem;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
}
.modal-close:hover { color: var(--text); }
.modal h2 { color: var(--accent); margin-bottom: 0.5rem; font-size: 1.6rem; }
.modal .meta-line { color: var(--text-muted); margin-bottom: 1rem; }
.modal .section { margin-bottom: 1.5rem; }
.modal .section h4 {
  color: var(--text);
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--border);
}
.modal pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  overflow-x: auto;
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 0.85rem;
  line-height: 1.5;
}
.modal code { color: var(--green); }
.modal .os-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.modal .os-item {
  padding: 0.3rem 0.8rem;
  border-radius: 6px;
  background: #21262d;
  font-size: 0.9rem;
}
.modal .perm-list { display: flex; flex-direction: column; gap: 0.4rem; }
.modal .perm-item {
  padding: 0.3rem 0.6rem;
  border-radius: 4px;
  background: #2d1b00;
  color: var(--orange);
  font-size: 0.85rem;
  font-family: monospace;
}
.modal .install-text {
  color: var(--text-muted);
  font-size: 0.9rem;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>⬡ Slate Plugins</h1>
  <p>Terminal dashboard widgets — WASM-sandboxed, multi-language, installable from GitHub</p>
</header>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" class="search-box" id="search" placeholder="Search plugins..." autocomplete="off">
  <div class="filter-group" id="os-filters">
    <button class="filter-btn active" data-os="all">🌐 All</button>
    <button class="filter-btn" data-os="macos">🍎 macOS</button>
    <button class="filter-btn" data-os="linux">🐧 Linux</button>
    <button class="filter-btn" data-os="windows">🪟 Windows</button>
  </div>
  <div class="filter-group" id="kind-filters">
    <button class="filter-btn active" data-kind="all">All Types</button>
    <button class="filter-btn" data-kind="builtin">Built-in</button>
    <button class="filter-btn" data-kind="plugin">Plugin</button>
    <button class="filter-btn" data-kind="script">Lua Script</button>
  </div>
  <div class="filter-group" id="tag-filters">
    <button class="filter-btn active" data-tag="all">All Tags</button>
  </div>
</div>

<div class="grid" id="grid">
{{CARDS}}
</div>

<div id="no-results">No plugins match your filters.</div>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">&times;</button>
    <h2 id="modal-name"></h2>
    <div class="meta-line" id="modal-meta"></div>
    <p class="description" id="modal-desc" style="margin-bottom:1.5rem"></p>
    <div class="section">
      <h4>Configuration</h4>
      <pre><code id="modal-config"></code></pre>
    </div>
    <div class="section">
      <h4>Platform Support</h4>
      <div class="os-list" id="modal-os"></div>
    </div>
    <div class="section">
      <h4>Permissions</h4>
      <div class="perm-list" id="modal-perms"></div>
    </div>
    <div class="section">
      <h4>Installation</h4>
      <div class="install-text" id="modal-install"></div>
    </div>
  </div>
</div>

<script>
const pluginData = {{PLUGIN_DATA}};

const cards = document.querySelectorAll('.plugin-card');
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
const stats = document.getElementById('stats');
const modal = document.getElementById('modal-overlay');

let osFilter = 'all';
let kindFilter = 'all';
let tagFilter = 'all';

// Build tag filter buttons dynamically from plugin data
(function buildTagFilters() {
  const tagSet = new Set();
  pluginData.forEach(p => { if (p.tags) p.tags.forEach(t => tagSet.add(t)); });
  const tagContainer = document.getElementById('tag-filters');
  Array.from(tagSet).sort().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.tag = tag;
    btn.textContent = tag;
    btn.addEventListener('click', () => {
      tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      tagFilter = tag;
      applyFilters();
    });
    tagContainer.appendChild(btn);
  });
  tagContainer.querySelector('[data-tag="all"]').addEventListener('click', () => {
    tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    tagContainer.querySelector('[data-tag="all"]').classList.add('active');
    tagFilter = 'all';
    applyFilters();
  });
})();

// Allow clicking tag badges on cards to filter
document.querySelectorAll('.tag-badge').forEach(badge => {
  badge.addEventListener('click', (e) => {
    e.stopPropagation();
    const tag = badge.textContent;
    const tagContainer = document.getElementById('tag-filters');
    tagContainer.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    const btn = tagContainer.querySelector('[data-tag="' + tag + '"]');
    if (btn) btn.classList.add('active');
    tagFilter = tag;
    applyFilters();
  });
});

function updateStats() {
  const visible = document.querySelectorAll('.plugin-card:not(.hidden)').length;
  stats.textContent = visible + ' of ' + cards.length + ' plugins shown';
  noResults.style.display = visible === 0 ? 'block' : 'none';
}

function applyFilters() {
  const q = search.value.toLowerCase();
  cards.forEach(card => {
    const name = card.dataset.name.toLowerCase();
    const desc = card.dataset.desc.toLowerCase();
    const cardOs = card.dataset.os;
    const cardKind = card.dataset.kind;
    const cardTags = card.dataset.tags || '';

    const matchesSearch = !q || name.includes(q) || desc.includes(q) || cardTags.includes(q);
    const matchesOs = osFilter === 'all' || cardOs.includes(osFilter);
    const matchesKind = kindFilter === 'all' || cardKind === kindFilter;
    const matchesTag = tagFilter === 'all' || cardTags.split(' ').includes(tagFilter);

    card.classList.toggle('hidden', !(matchesSearch && matchesOs && matchesKind && matchesTag));
  });
  updateStats();
}

function showDetail(idx) {
  const p = pluginData[idx];
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-meta').textContent = 'v' + p.version + ' · ' + p.author + ' · ' + p.lang;
  document.getElementById('modal-desc').textContent = p.desc;
  document.getElementById('modal-config').textContent = p.config;

  const osEl = document.getElementById('modal-os');
  const osIcons = {macos: '🍎', linux: '🐧', windows: '🪟'};
  osEl.innerHTML = p.os.map(o => '<span class="os-item">' + (osIcons[o]||'') + ' ' + o + '</span>').join('');

  const permsEl = document.getElementById('modal-perms');
  if (p.perms.length === 0) {
    permsEl.innerHTML = '<em style="color:var(--text-muted)">None required</em>';
  } else {
    permsEl.innerHTML = p.perms.map(perm => '<span class="perm-item">' + perm + '</span>').join('');
  }

  document.getElementById('modal-install').textContent = p.install;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

search.addEventListener('input', applyFilters);

document.querySelectorAll('#os-filters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#os-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    osFilter = btn.dataset.os;
    applyFilters();
  });
});

document.querySelectorAll('#kind-filters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#kind-filters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    kindFilter = btn.dataset.kind;
    applyFilters();
  });
});

updateStats();
</script>
</body>
</html>
