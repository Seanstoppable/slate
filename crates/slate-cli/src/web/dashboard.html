<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slate Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: #1f2937;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #22d3ee;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 1.1rem;
      margin: 0;
    }

    #updated-at {
      color: var(--muted);
      font-size: 0.9rem;
    }

    #dashboard {
      display: grid;
      gap: 1rem;
      padding: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      min-height: 160px;
      overflow: hidden;
    }

    .card h2 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
    }

    .card .subtitle {
      margin-bottom: 0.9rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .text-content {
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .key-value-list {
      display: grid;
      gap: 0.55rem;
    }

    .key-value-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 0.35rem;
    }

    .key-value-row .key {
      color: var(--muted);
      font-weight: 600;
    }

    .list {
      display: grid;
      gap: 0.65rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .list li {
      padding: 0.75rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
    }

    .list .item-title {
      font-weight: 600;
    }

    .list .item-subtitle {
      color: var(--muted);
      margin-top: 0.25rem;
      font-size: 0.9rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th, td {
      text-align: left;
      padding: 0.45rem 0.35rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: top;
    }

    th {
      color: #fde68a;
      font-weight: 700;
    }

    .chart-row {
      display: grid;
      grid-template-columns: minmax(72px, auto) 1fr auto;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }

    .chart-label, .chart-value {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .chart-bar {
      height: 0.85rem;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #34d399);
      min-width: 2px;
    }

    .empty-state {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Slate Dashboard</h1>
    <div id="updated-at">Loading…</div>
  </header>
  <main id="dashboard"></main>
  <script>
    const dashboard = document.getElementById("dashboard");
    const updatedAt = document.getElementById("updated-at");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function colorToCss(color) {
      if (!color) return "";
      if (typeof color === "string") {
        const map = {
          red: "#f87171",
          green: "#34d399",
          yellow: "#fbbf24",
          blue: "#60a5fa",
          magenta: "#f472b6",
          cyan: "#22d3ee",
          white: "#f9fafb",
          gray: "#9ca3af"
        };
        return map[color] || "";
      }
      if (color.rgb && Array.isArray(color.rgb) && color.rgb.length === 3) {
        return `rgb(${color.rgb.join(",")})`;
      }
      return "";
    }

    function styleText(text, style) {
      const rules = [];
      const fg = colorToCss(style?.fg);
      const bg = colorToCss(style?.bg);
      if (fg) rules.push(`color:${fg}`);
      if (bg) rules.push(`background:${bg}`);
      if (style?.bold) rules.push("font-weight:700");
      if (style?.italic) rules.push("font-style:italic");
      return `<span style="${rules.join(";")}">${escapeHtml(text)}</span>`;
    }

    function renderText(content) {
      return `<div class="text-content">${escapeHtml(content.content)}</div>`;
    }

    function renderKeyValue(content) {
      return `
        <div class="key-value-list">
          ${content.pairs.map(([key, cell]) => `
            <div class="key-value-row">
              <span class="key">${escapeHtml(key)}</span>
              <span>${styleText(cell.text, cell.style)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderList(content) {
      return `
        <ul class="list">
          ${content.items.map(item => `
            <li>
              <div class="item-title">${escapeHtml(item.icon ? `${item.icon} ${item.title}` : item.title)}</div>
              ${item.subtitle ? `<div class="item-subtitle">${escapeHtml(item.subtitle)}</div>` : ""}
            </li>
          `).join("")}
        </ul>
      `;
    }

    function renderTable(content) {
      return `
        <table>
          <thead>
            <tr>${content.headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr>
          </thead>
          <tbody>
            ${content.rows.map(row => `
              <tr>${row.map(cell => `<td>${styleText(cell.text, cell.style)}</td>`).join("")}</tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderChart(content) {
      const max = content.data.reduce((value, point) => Math.max(value, point.value), 0);
      return content.data.map(point => {
        const width = max > 0 ? Math.max((point.value / max) * 100, 1) : 0;
        return `
          <div class="chart-row">
            <div class="chart-label">${escapeHtml(point.label)}</div>
            <div class="chart-bar" style="width:${width}%"></div>
            <div class="chart-value">${escapeHtml(point.value)}</div>
          </div>
        `;
      }).join("");
    }

    function renderEmpty(content) {
      return `<div class="empty-state">${escapeHtml(content.message)}</div>`;
    }

    function renderContent(content) {
      switch (content.type) {
        case "text": return renderText(content);
        case "key_value": return renderKeyValue(content);
        case "list": return renderList(content);
        case "table": return renderTable(content);
        case "chart": return renderChart(content);
        case "empty": return renderEmpty(content);
        default: return `<div class="empty-state">Unsupported content type: ${escapeHtml(content.type)}</div>`;
      }
    }

    function renderDashboard(snapshot) {
      dashboard.style.gridTemplateColumns = `repeat(${Math.max(snapshot.layout.cols, 1)}, minmax(0, 1fr))`;
      updatedAt.textContent = `Updated ${new Date(snapshot.generated_at_epoch_seconds * 1000).toLocaleTimeString()}`;
      dashboard.innerHTML = snapshot.widgets.map(widget => {
        const borderColor = colorToCss(widget.border_color) || "var(--border)";
        return `
          <section class="card" style="
            grid-column: ${widget.position.col + 1} / span ${Math.max(widget.position.col_span, 1)};
            grid-row: ${widget.position.row + 1} / span ${Math.max(widget.position.row_span, 1)};
            border-color: ${borderColor};
          ">
            <h2>${escapeHtml(widget.metadata.name)}</h2>
            <div class="subtitle">${escapeHtml(widget.metadata.description)}</div>
            ${renderContent(widget.content)}
          </section>
        `;
      }).join("");
    }

    async function loadDashboard() {
      try {
        const response = await fetch("/api/dashboard", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }
        renderDashboard(await response.json());
      } catch (error) {
        updatedAt.textContent = "Unable to load dashboard";
        dashboard.innerHTML = `<section class="card"><div class="empty-state">${escapeHtml(error.message)}</div></section>`;
      }
    }

    loadDashboard();
    setInterval(loadDashboard, 5000);
  </script>
</body>
</html>
