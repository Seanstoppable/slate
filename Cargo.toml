[workspace]
members = [
    "crates/slate-core",
    "crates/slate-plugin-host",
    "crates/slate-plugin-sdk",
    "crates/slate-plugin-manager",
    "crates/slate-cli",
]
exclude = [
    "plugins/clock",
    "plugins/devto",
    "plugins/digitalclock",
    "plugins/docker",
    "plugins/ipinfo",
    "plugins/hackernews",
    "plugins/github",
    "plugins/lunarphase",
    "plugins/pihole",
    "plugins/subreddit",
    "plugins/urlcheck",
    "plugins/vcs",
    "plugins/yfinance",
]
resolver = "2"

# Trim PDB/debuginfo generation for dev + test builds. Full debuginfo is the
# dominant linker cost on Windows for this workspace (mlua/luau, extism,
# wasmparser); line-tables-only keeps panic backtraces useful while cutting
# link time noticeably.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Seanstoppable/slate"

[workspace.dependencies]
slate-core = { path = "crates/slate-core" }
slate-plugin-host = { path = "crates/slate-plugin-host" }
slate-plugin-sdk = { path = "crates/slate-plugin-sdk" }
slate-plugin-manager = { path = "crates/slate-plugin-manager" }

# Shared dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.28"
ratatui = "0.29"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
extism = "1"
mlua = { version = "0.10", features = ["luau", "serialize", "send"] }
semver = "1"
sha2 = "0.10"
dirs = "6"
sysinfo = "0.34"
wasmparser = "0.229"
